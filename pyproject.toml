[build-system]
requires = ["setuptools >= 74.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libpff-python"
version = "20260526"
description = "Python bindings for libpff - access PFF and OFF files (PST, OST, PAB)"
authors = [
    { name = "Joachim Metz", email = "joachim.metz@gmail.com" },
]
maintainers = [
    { name = "Joachim Metz", email = "joachim.metz@gmail.com" },
]
keywords = ["pff", "off", "pst", "ost", "pab", "outlook", "forensics"]
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
readme = {file = "README.md", content-type = "text/markdown"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Filesystems",
]
requires-python = ">=3.10"

[project.urls]
Documentation = "https://github.com/libyal/libpff/wiki/Home"
Homepage = "https://github.com/libyal/libpff"
Repository = "https://github.com/libyal/libpff"

[tool.setuptools]
py-modules = ["_build"]

[[tool.setuptools.ext-modules]]
name = "pypff"
sources = []

[tool.setuptools.cmdclass]
build_ext = "_build.custom_build_ext"
sdist = "_build.custom_sdist"
